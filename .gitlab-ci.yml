workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - prepare
  - static
  - test

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  CI_PHP_IMAGE: "registry.gzcrm.cn/php-group/ci-dockerfile:v0.1.4-php8.4"

default:
  interruptible: true
  cache:
    - key:
        files:
          - composer.lock
        prefix: "composer-cache"
      paths:
        - .composer-cache/
      policy: pull

deps:
  stage: prepare
  image: "$CI_PHP_IMAGE"
  cache:
    - key:
        files:
          - composer.lock
        prefix: "composer-cache"
      paths:
        - .composer-cache/
      policy: pull-push
  before_script:
    - ci-composer-auth
    - php -v
    - composer --version
  script:
    - composer validate
    - composer install --prefer-dist --no-progress --no-interaction
  artifacts:
    name: "vendor-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 8h
    paths:
      - vendor/
      - composer.lock

phpstan:
  stage: static
  image: "$CI_PHP_IMAGE"
  needs:
    - job: deps
      artifacts: true
  script:
    - php -v
    - ./vendor/bin/phpstan analyse src tests --level=5 --memory-limit=2G

phpunit:
  stage: test
  image: "$CI_PHP_IMAGE"
  needs:
    - job: deps
      artifacts: true
  script:
    - |
      redis-server --save "" --appendonly no --daemonize yes
      for i in $(seq 1 30); do
        if redis-cli ping >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done
      redis-cli ping
    - php -v
    - ./vendor/bin/phpunit tests
